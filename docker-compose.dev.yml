services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.admin
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Create .env from .env.example and set BOT_TOKEN}
      ADMIN_ID: ${ADMIN_ID:-0}
      DEV: "0"
      DB_PATH: /data/app.db
      SETTINGS_PATH: /app/settings.json
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./tasks:/app/tasks:ro
      - app_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  tunnel:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: ["http", "--url=${NGROK_DOMAIN}", "--log=stdout", "web:8000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      web:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    command: ["python", "bot.py"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Create .env from .env.example and set BOT_TOKEN}
      ADMIN_ID: ${ADMIN_ID:-0}
      DB_PATH: /data/app.db
      SETTINGS_PATH: /app/settings.json
      WEBAPP_URL: ${WEBAPP_URL}
    depends_on:
      web:
        condition: service_healthy
      tunnel:
        condition: service_started
    volumes:
      - app_data:/data

volumes:
  app_data: